<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Villa Vip Country Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
</head>

<body class="auth-page">

  <main class="auth-container">
    <div class="auth-brand">
      <svg viewBox="0 0 240 200">
        <path fill="currentColor"
          d="M120 80C104 82 80 80 58 72C38 64 22 50 14 36C26 46 48 52 70 52C92 52 110 60 120 78C130 60 148 52 170 52C192 52 214 46 226 36C218 50 202 64 182 72C160 80 136 82 120 80Z" />
        <path fill="currentColor" d="M78 84 L120 170 L162 84 L139 84 L120 126 L101 84 Z" />
      </svg>
      <h1 class="auth-title">BEM-VINDO<br>DE VOLTA</h1>
      <span class="auth-subtitle">Faça login para continuar</span>
    </div>

    <div id="authMessage" class="auth-msg" hidden></div>

    <form id="loginForm" class="auth-form">
      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" class="auth-input" required>
      </div>

      <div class="input-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="••••••••" class="auth-input" required>
      </div>

      <button type="submit" class="auth-btn">Entrar na Loja</button>
    </form>

    <p class="auth-link">Não tem uma conta? <a href="register.html">Cadastre-se aqui</a></p>
  </main>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      const btn = e.target.querySelector('button');
      const msgBox = document.getElementById('authMessage');

      btn.disabled = true;
      btn.textContent = "AGUARDE...";
      msgBox.hidden = true;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = '/';
        } else {
          msgBox.className = "auth-msg error";
          msgBox.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> <span>${data.message || 'Erro ao realizar login'}</span>`;
          msgBox.hidden = false;
          btn.disabled = false;
          btn.textContent = "ENTRAR NA LOJA";
        }
      } catch (err) {
        msgBox.className = "auth-msg error";
        msgBox.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> <span>Erro de conexão com o servidor.</span>`;
        msgBox.hidden = false;
        btn.disabled = false;
        btn.textContent = "ENTRAR NA LOJA";
      }
    });
  </script>
</body>

</html>
