<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditoria · Villa Vip</title>
  <meta name="robots" content="noindex">
  <link rel="shortcut icon" href="/assets/logo-mark.svg" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>

<body class="dash">
  <!-- Top-bar e blocos de estado são injetados por js/core/partials.js -->
  <main class="dash-main" id="dashMain" aria-busy="true">

    <div id="pageContent" hidden>
      <section class="dash-head pe-head">
        <div>
          <h1>Auditoria</h1>
          <p id="auditCount">—</p>
        </div>
        <div class="pe-toolbar">
          <input class="pe-search" id="actorFilter" type="search" placeholder="Filtrar por e-mail…">
          <select class="pe-select" id="targetFilter">
            <option value="">Todos os alvos</option>
            <option value="product">Produto</option>
            <option value="product_image">Imagem de produto</option>
            <option value="order">Pedido</option>
            <option value="store">Loja</option>
            <option value="estoque">Estoque</option>
            <option value="venda_presencial">Venda presencial</option>
          </select>
        </div>
      </section>

      <div class="pe-table-wrap">
        <div class="table-scroll">
          <table class="dash-table pe-table">
            <thead>
              <tr>
                <th>Quando</th>
                <th>Quem</th>
                <th>Ação</th>
                <th>Alvo</th>
                <th>Diff</th>
              </tr>
            </thead>
            <tbody id="auditBody"></tbody>
          </table>
        </div>
        <p class="pe-empty" id="emptyMsg" hidden>Sem registros para os filtros aplicados.</p>
        <div class="vv-pager" id="pager" hidden>
          <button type="button" class="dash-btn ghost dark" id="pgPrev">‹ Anterior</button>
          <span class="vv-pager-info" id="pgInfo">—</span>
          <button type="button" class="dash-btn ghost dark" id="pgNext">Próximo ›</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal: diff do evento -->
  <div class="pe-overlay" id="diffOverlay" hidden role="dialog" aria-modal="true" aria-labelledby="diffTitle">
    <div class="pe-modal">
      <header class="pe-modal-head">
        <h2 id="diffTitle">Detalhes</h2>
        <button class="pe-modal-close" id="diffClose" type="button" aria-label="Fechar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </header>
      <div class="pe-form" id="diffBody"></div>
    </div>
  </div>

  <script src="/js/core/shared.js"></script>
  <script src="/js/core/partials.js"></script>
  <script src="/js/core/admin-shell.js"></script>
  <script>
    (function boot() {
      VV.partials.adminTopbar({ subtitle: "Auditoria" });
      VV.partials.adminStates();
      VV.adminShell.mount({ active: "auditoria" });
    })();
  </script>
  <script src="/js/admin/auditoria-admin.js"></script>
</body>
</html>
