<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor de Produtos · Villa Vip</title>
  <meta name="robots" content="noindex">
  <link rel="shortcut icon" href="/assets/logo-mark.svg" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>

<body class="dash">

  <!-- Top-bar e blocos de estado são injetados por js/core/partials.js -->
  <main class="dash-main" id="dashMain" aria-busy="true">

    <!-- Conteúdo principal -->
    <div id="pageContent" hidden>

      <section class="dash-head pe-head">
        <div>
          <h1>Produtos</h1>
          <p id="productCount">—</p>
        </div>
        <div class="pe-toolbar">
          <input class="pe-search" id="searchInput" type="search" placeholder="Buscar por nome, marca ou ref…" aria-label="Buscar produto">
          <select class="pe-select" id="catFilter" aria-label="Filtrar por categoria">
            <option value="">Todas as categorias</option>
          </select>
          <button type="button" class="dash-btn ghost" id="btnExport" title="Exportar catálogo (CSV)">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <span>Exportar CSV</span>
          </button>
        </div>
      </section>

      <div class="pe-table-wrap">
        <div class="table-scroll">
          <table class="dash-table pe-table" id="productsTable">
            <thead>
              <tr>
                <th>Ref.</th>
                <th>Nome</th>
                <th>Categoria</th>
                <th>Marca</th>
                <th class="num">Preço</th>
                <th class="num">De</th>
                <th>Tag</th>
                <th class="tc">Destaque</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="productsBody"></tbody>
          </table>
        </div>
        <p class="pe-empty" id="emptyMsg" hidden>Nenhum produto encontrado.</p>
        <div class="vv-pager" id="pager" hidden>
          <button type="button" class="dash-btn ghost dark" id="pgPrev">‹ Anterior</button>
          <span class="vv-pager-info" id="pgInfo">—</span>
          <button type="button" class="dash-btn ghost dark" id="pgNext">Próximo ›</button>
        </div>
      </div>

    </div>
  </main>

  <!-- Modal: formulário de produto (criar / editar) -->
  <div class="pe-overlay" id="formOverlay" hidden role="dialog" aria-modal="true" aria-labelledby="formTitle">
    <div class="pe-modal">
      <header class="pe-modal-head">
        <h2 id="formTitle">Novo Produto</h2>
        <button class="pe-modal-close" id="formClose" type="button" aria-label="Fechar">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </header>

      <form id="productForm" class="pe-form" novalidate>
        <p class="pe-form-msg" id="formMsg" hidden></p>

        <div class="pe-row">
          <div class="pe-field">
            <label for="fId">Referência (ID) <span aria-hidden="true">*</span></label>
            <input type="text" id="fId" placeholder="Ex: BT-105" required autocomplete="off">
          </div>
          <div class="pe-field pe-field--check">
            <label class="pe-check-label">
              <input type="checkbox" id="fDestaque">
              <span>Destaque na vitrine</span>
            </label>
          </div>
        </div>

        <div class="pe-field">
          <label for="fNome">Nome do produto <span aria-hidden="true">*</span></label>
          <input type="text" id="fNome" placeholder="Ex: Bota Texana Couro Legítimo Bico Fino" required>
        </div>

        <div class="pe-row">
          <div class="pe-field">
            <label for="fCategoria">Categoria <span aria-hidden="true">*</span></label>
            <select id="fCategoria" required>
              <option value="">Selecionar…</option>
            </select>
          </div>
          <div class="pe-field">
            <label for="fMarca">Marca <span aria-hidden="true">*</span></label>
            <select id="fMarca" required>
              <option value="">Selecionar…</option>
            </select>
          </div>
        </div>

        <div class="pe-row">
          <div class="pe-field">
            <label for="fPreco">Preço atual (R$) <span aria-hidden="true">*</span></label>
            <input type="number" id="fPreco" min="0" step="0.01" placeholder="0,00" required>
          </div>
          <div class="pe-field">
            <label for="fPrecoDe">Preço "de" (R$) <small>— opcional, cria desconto</small></label>
            <input type="number" id="fPrecoDe" min="0" step="0.01" placeholder="0,00">
          </div>
        </div>

        <div class="pe-field">
          <label for="fDescricao">Descrição</label>
          <textarea id="fDescricao" rows="3" placeholder="Descreva o produto, materiais, diferenciais…"></textarea>
        </div>

        <div class="pe-field">
          <label>Fotos do produto <small>— até 5; a primeira é a capa</small></label>
          <div class="pe-img-section">
            <div class="pe-gallery" id="galleryGrid"></div>
            <label class="pe-img-drop" id="imgDrop" for="fImagem">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <span>Arraste fotos ou clique para escolher</span>
              <small>JPG, PNG ou WebP · máx. 8 MB cada · pode enviar várias de uma vez</small>
              <input type="file" id="fImagem" accept="image/jpeg,image/png,image/webp" multiple>
            </label>
            <div class="pe-img-url-row">
              <span class="pe-img-or">ou cole uma URL</span>
              <input type="url" id="fImagemUrl" class="pe-img-url" placeholder="https://exemplo.com/foto.jpg" autocomplete="off">
              <button type="button" class="dash-btn ghost dark pe-img-url-add" id="fImagemUrlAdd">Adicionar</button>
            </div>
            <p class="pe-img-status" id="imgStatus" hidden></p>
          </div>
        </div>

        <div class="pe-field">
          <label>Tamanhos disponíveis</label>
          <div class="pe-tags" id="tagsContainer" role="group" aria-label="Tamanhos">
            <input class="pe-tag-input" id="tagsInput" type="text" placeholder="Digite e pressione Enter…" autocomplete="off">
          </div>
          <small class="pe-hint">Pressione Enter ou vírgula para adicionar. Backspace remove o último.</small>
        </div>

        <div class="pe-field">
          <label for="fTag">Etiqueta de merchandising</label>
          <select id="fTag">
            <option value="">Sem etiqueta</option>
            <option value="Novo">Novo</option>
            <option value="Mais vendido">Mais vendido</option>
          </select>
        </div>

        <footer class="pe-form-foot">
          <button type="button" class="dash-btn ghost dark" id="formCancel">Cancelar</button>
          <button type="submit" class="dash-btn solid" id="formSubmit">Criar produto</button>
        </footer>
      </form>
    </div>
  </div>

  <script src="/js/core/shared.js"></script>
  <script src="/js/core/partials.js"></script>
  <script src="/js/core/admin-shell.js"></script>
  <script>
    (function boot() {
      const P = VV.partials;
      P.adminTopbar({
        subtitle: "Editor de Produtos",
        actions: [
          P.actionLink("/admin", "Inteligência", "intelligence", { title: "Painel de inteligência" }),
          P.actionLink("/", "Catálogo", "catalog", { title: "Catálogo público" }),
          P.actionButton("btnNewProduct", "Novo Produto", "plus", { solid: true }),
        ],
      });
      P.adminStates({ loadingText: "Carregando produtos…" });
      VV.adminShell.mount({ active: "produtos" });
    })();
  </script>
  <script src="/js/admin/products-admin.js"></script>
</body>

</html>
