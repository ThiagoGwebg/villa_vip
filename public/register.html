<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar | Villa Vip Country Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="shortcut icon" href="assets/logo-mark.svg" type="image/x-icon">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
</head>

<body class="auth-page">

  <main class="auth-container">
    <div class="auth-brand">
      <svg viewBox="0 0 240 200">
        <path fill="currentColor"
          d="M120 80C104 82 80 80 58 72C38 64 22 50 14 36C26 46 48 52 70 52C92 52 110 60 120 78C130 60 148 52 170 52C192 52 214 46 226 36C218 50 202 64 182 72C160 80 136 82 120 80Z" />
        <path fill="currentColor" d="M78 84 L120 170 L162 84 L139 84 L120 126 L101 84 Z" />
      </svg>
      <h1 class="auth-title">CRIAR CONTA</h1>
      <span class="auth-subtitle">Junte-se à Villa Vip</span>
    </div>

    <div id="authMessage" class="auth-msg" hidden></div>

    <form id="registerForm" class="auth-form">
      <div class="input-group">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" placeholder="João da Silva" class="auth-input" required>
      </div>

      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" class="auth-input" required>
      </div>

      <div class="input-group">
        <label for="emailConfirm">Confirmar E-mail</label>
        <input type="email" id="emailConfirm" placeholder="seu@email.com" class="auth-input" required>
      </div>

      <div class="input-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="••••••••" class="auth-input" required minlength="6">
      </div>

      <div class="input-group">
        <label for="senhaConfirm">Confirmar Senha</label>
        <input type="password" id="senhaConfirm" placeholder="••••••••" class="auth-input" required minlength="6">
      </div>

      <button type="submit" class="auth-btn">CADASTRAR</button>
    </form>

    <p class="auth-link">Já possui uma conta? <a href="login.html">Faça login</a></p>
  </main>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nome = document.getElementById('nome').value;
      const email = document.getElementById('email').value;
      const emailConfirm = document.getElementById('emailConfirm').value;
      const senha = document.getElementById('senha').value;
      const senhaConfirm = document.getElementById('senhaConfirm').value;

      const btn = e.target.querySelector('button');
      const msgBox = document.getElementById('authMessage');

      // Validações no frontend
      if (email !== emailConfirm) {
        msgBox.className = "auth-msg error";
        msgBox.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> <span>Os e-mails não são iguais.</span>`;
        msgBox.hidden = false;
        return;
      }

      if (senha !== senhaConfirm) {
        msgBox.className = "auth-msg error";
        msgBox.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> <span>As senhas não são iguais.</span>`;
        msgBox.hidden = false;
        return;
      }

      btn.disabled = true;
      btn.textContent = "AGUARDE...";
      msgBox.hidden = true;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, email, senha })
        });

        const data = await res.json();

        if (res.ok) {
          msgBox.className = "auth-msg success";
          msgBox.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg> <span>${data.message || 'Conta criada! Confirme seu e-mail.'}</span>`;
          msgBox.hidden = false;
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 3500);
        } else {
          msgBox.className = "auth-msg error";
          msgBox.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> <span>${data.message || 'Erro ao realizar cadastro'}</span>`;
          msgBox.hidden = false;
          btn.disabled = false;
          btn.textContent = "CADASTRAR";
        }
      } catch (err) {
        msgBox.className = "auth-msg error";
        msgBox.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> <span>Erro de conexão com o servidor.</span>`;
        msgBox.hidden = false;
        btn.disabled = false;
        btn.textContent = "CADASTRAR";
      }
    });
  </script>
</body>

</html>
