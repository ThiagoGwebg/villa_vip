<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro | Villa Vip</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="wrap">
    <div class="auth-container">
      <h1 class="auth-title">Criar Conta</h1>
      <div id="authMessage" hidden></div>
      <form id="registerForm" class="auth-form">
        <input type="text" id="nome" placeholder="Nome" class="auth-input" required>
        <input type="email" id="email" placeholder="E-mail" class="auth-input" required>
        <input type="password" id="senha" placeholder="Senha" class="auth-input" required>
        <button type="submit" class="auth-btn">Cadastrar</button>
      </form>
      <p class="auth-link">Já tem conta? <a href="login.html">Entrar</a></p>
    </div>
  </div>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nome = document.getElementById('nome').value;
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      const btn = e.target.querySelector('button');
      const msgBox = document.getElementById('authMessage');
      
      btn.disabled = true;
      btn.textContent = "Cadastrando...";
      msgBox.hidden = true;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, email, senha })
        });
        
        const data = await res.json();
        
        if (res.ok) {
          msgBox.className = "auth-success";
          msgBox.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg> Conta criada! Redirecionando...`;
          msgBox.hidden = false;
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        } else {
          msgBox.className = "auth-error";
          msgBox.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> ${data.message || 'Erro ao realizar cadastro'}`;
          msgBox.hidden = false;
        }
      } catch (err) {
        msgBox.className = "auth-error";
        msgBox.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> Erro de conexão com o servidor.`;
        msgBox.hidden = false;
        btn.disabled = false;
        btn.textContent = "Cadastrar";
      }
    });
  </script>
</body>
</html>
