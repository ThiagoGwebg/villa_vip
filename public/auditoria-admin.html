<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditoria · Villa Vip</title>
  <meta name="robots" content="noindex">
  <link rel="shortcut icon" href="/assets/logo-mark.svg" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin.css">
</head>

<body class="dash">
  <header class="dash-top">
    <div class="dash-top-wrap">
      <a class="dash-brand" href="/" title="Voltar ao catálogo">
        <svg class="dash-longhorn" viewBox="0 0 240 200" aria-hidden="true">
          <path fill="currentColor" d="M120 80C104 82 80 80 58 72C38 64 22 50 14 36C26 46 48 52 70 52C92 52 110 60 120 78C130 60 148 52 170 52C192 52 214 46 226 36C218 50 202 64 182 72C160 80 136 82 120 80Z" />
          <path fill="currentColor" d="M78 84 L120 170 L162 84 L139 84 L120 126 L101 84 Z" />
        </svg>
        <span><strong>Villa Vip</strong><small>Auditoria</small></span>
      </a>
      <div class="dash-top-actions">
        <span class="dash-stamp" id="stamp">Carregando…</span>
        <div class="dash-user">
          <span class="dash-avatar" id="userInitial">V</span>
          <span class="dash-uname" id="userName">—</span>
        </div>
        <button type="button" class="dash-btn ghost" id="btnLogout">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
          <span>Sair</span>
        </button>
      </div>
    </div>
  </header>

  <main class="dash-main" id="dashMain" aria-busy="true">
    <div class="dash-state" id="loadingState"><div class="dash-spinner" aria-hidden="true"></div><p>Carregando…</p></div>
    <div class="dash-state err" id="errorState" hidden>
      <p id="errorMsg">Não foi possível carregar.</p>
      <button type="button" class="dash-btn solid" id="btnRetry">Tentar novamente</button>
    </div>
    <div class="dash-state err" id="denyState" hidden>
      <p><strong>Acesso restrito a administradores</strong></p>
      <div class="dash-state-actions">
        <a class="dash-btn ghost dark" href="/">Voltar ao catálogo</a>
        <button type="button" class="dash-btn solid" id="btnDenyLogout">Trocar de conta</button>
      </div>
    </div>

    <div id="pageContent" hidden>
      <section class="dash-head pe-head">
        <div>
          <h1>Auditoria</h1>
          <p id="auditCount">—</p>
        </div>
        <div class="pe-toolbar">
          <input class="pe-search" id="actorFilter" type="search" placeholder="Filtrar por e-mail…">
          <select class="pe-select" id="targetFilter">
            <option value="">Todos os alvos</option>
            <option value="product">Produto</option>
            <option value="product_image">Imagem de produto</option>
            <option value="order">Pedido</option>
            <option value="store">Loja</option>
            <option value="estoque">Estoque</option>
            <option value="venda_presencial">Venda presencial</option>
          </select>
        </div>
      </section>

      <div class="pe-table-wrap">
        <div class="table-scroll">
          <table class="dash-table pe-table">
            <thead>
              <tr>
                <th>Quando</th>
                <th>Quem</th>
                <th>Ação</th>
                <th>Alvo</th>
                <th>Diff</th>
              </tr>
            </thead>
            <tbody id="auditBody"></tbody>
          </table>
        </div>
        <p class="pe-empty" id="emptyMsg" hidden>Sem registros para os filtros aplicados.</p>
        <div class="vv-pager" id="pager" hidden>
          <button type="button" class="dash-btn ghost dark" id="pgPrev">‹ Anterior</button>
          <span class="vv-pager-info" id="pgInfo">—</span>
          <button type="button" class="dash-btn ghost dark" id="pgNext">Próximo ›</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal: diff do evento -->
  <div class="pe-overlay" id="diffOverlay" hidden role="dialog" aria-modal="true" aria-labelledby="diffTitle">
    <div class="pe-modal">
      <header class="pe-modal-head">
        <h2 id="diffTitle">Detalhes</h2>
        <button class="pe-modal-close" id="diffClose" type="button" aria-label="Fechar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </header>
      <div class="pe-form" id="diffBody"></div>
    </div>
  </div>

  <script src="/shared.js"></script>
  <script src="/admin-shell.js"></script>
  <script>
    (function greet() {
      const u = VV.user();
      if (u && u.nome) {
        document.getElementById("userName").textContent = u.nome;
        document.getElementById("userInitial").textContent = u.nome.trim().charAt(0).toUpperCase() || "V";
      }
      VV.adminShell.mount({ active: "auditoria" });
    })();
  </script>
  <script src="/auditoria-admin.js"></script>
</body>
</html>
